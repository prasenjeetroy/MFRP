    let currentUser = null;

    const dataHandler = {

        onDataChanged(data) {

            allUsers = data || [];

            if (pendingSignupEmail) {

                const acc = allUsers.find(u => (u.email || '').toLowerCase() === pendingSignupEmail);

                if (acc) { pendingSignupEmail = null; enterApp(acc); }

            } else if (currentUserEmail) {

                if (acc) { userData = acc; updateStats(); }

    async function initApp() {

        if (window.emailjs && EMAILJS_PUBLIC_KEY && !EMAILJS_PUBLIC_KEY.startsWith('YOUR_')) {

            emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

        }

        const result = await window.dataSdk.init(dataHandler);

    function isValidEmail(email) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    }



    function randomHex(numBytes) {

        const arr = new Uint8Array(numBytes);

        crypto.getRandomValues(arr);

        return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');

    }



    async function sha256Hex(str) {

        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));

        return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');

    }

        el.textContent = msg; el.style.color = kind === 'good' ? '#059669' : '#dc2626';

    function switchAuthTab(tab) {

        clearAuthMessage();

        const loginForm = document.getElementById('login-form');

        const signupForm = document.getElementById('signup-form');

        const tabLogin = document.getElementById('tab-login');

        const tabSignup = document.getElementById('tab-signup');

        if (tab === 'login') {

            loginForm.classList.remove('hidden'); signupForm.classList.add('hidden');

            tabLogin.classList.add('tab-active'); tabSignup.classList.remove('tab-active');

        } else {

            loginForm.classList.add('hidden'); signupForm.classList.remove('hidden');

            tabSignup.classList.add('tab-active'); tabLogin.classList.remove('tab-active');

        }

    }



    async function signUp() {

        clearAuthMessage();

        const name = document.getElementById('signup-name').value.trim();

        const email = document.getElementById('signup-email').value.trim().toLowerCase();

        const pw = document.getElementById('signup-password').value;

        const pw2 = document.getElementById('signup-password2').value;

        if (!name) { setAuthMessage('Please enter a display name.', 'bad'); return; }

        if (!isValidEmail(email)) { setAuthMessage('Please enter a valid email address.', 'bad'); return; }

        if (pw.length < 6) { setAuthMessage('Password must be at least 6 characters.', 'bad'); return; }

        if (pw !== pw2) { setAuthMessage('Passwords do not match.', 'bad'); return; }

        if (allUsers.some(u => (u.email || '').toLowerCase() === email)) { setAuthMessage('An account with that email already exists. Try logging in instead.', 'bad'); return; }

        const salt = randomHex(16);

        const hash = await sha256Hex(salt + pw);

        pendingSignupEmail = email;

        setAuthMessage('Creating your account…', 'good');

        await window.dataSdk.create({ email, display_name: name, password_salt: salt, password_hash: hash, total_score: 0, quizzes_taken: 0, avg_accuracy: 0, last_category: '', difficulty_level: 1, reset_code: null, reset_code_expires: null, last_code_sent_at: null });

    }

        clearAuthMessage();

        const email = document.getElementById('login-email').value.trim().toLowerCase();

        const pw = document.getElementById('login-password').value;

        if (!isValidEmail(email)) { setAuthMessage('Please enter a valid email address.', 'bad'); return; }

        if (!pw) { setAuthMessage('Please enter your password.', 'bad'); return; }

        const account = allUsers.find(u => (u.email || '').toLowerCase() === email);

        if (!account) { setAuthMessage('No account found for that email. Try signing up instead.', 'bad'); return; }

        const hash = await sha256Hex(account.password_salt + pw);

        if (hash === account.password_hash) {

            enterApp(account);

        } else {

            setAuthMessage('Incorrect password. Sending a verification code to your email…', 'bad');

            await sendResetCode(account);

        }

    }



    function startForgotPassword() {

        clearAuthMessage();

        const email = document.getElementById('login-email').value.trim().toLowerCase();

        if (!isValidEmail(email)) { setAuthMessage('Enter your email address above first, then click "Forgot password?".', 'bad'); return; }

        const account = allUsers.find(u => (u.email || '').toLowerCase() === email);

        if (!account) { setAuthMessage('No account found for that email.', 'bad'); return; }

        sendResetCode(account);

    }



    async function sendResetCode(account) {

        const now = Date.now();

        if (account.last_code_sent_at && now - account.last_code_sent_at < RESET_CODE_COOLDOWN_MS) {

            showResetScreen(account.email, 'A code was already sent recently — check your inbox.');

            return;

        }

        const code = String(Math.floor(100000 + Math.random() * 900000));

        const updated = { ...account, reset_code: code, reset_code_expires: now + RESET_CODE_EXPIRY_MS, last_code_sent_at: now };

        await window.dataSdk.update(updated);

        showResetScreen(account.email, '');

        try {

            await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email: account.email, to_name: account.display_name, code });

            setResetMessage('A verification code was sent to your email.', 'good');

        } catch (err) {

            console.error('EmailJS send failed', err);

            setResetMessage('Could not send the email — check the EmailJS configuration at the top of the script.', 'bad');

        }

    }



    function showResetScreen(email, msg) {

        pendingResetEmail = email;

        document.getElementById('auth-screen').classList.add('hidden');

        document.getElementById('reset-screen').classList.remove('hidden');

        document.getElementById('reset-email-display').textContent = email;

        document.getElementById('reset-code').value = '';

        document.getElementById('reset-password').value = '';

        document.getElementById('reset-password2').value = '';

        if (msg) setResetMessage(msg, 'good'); else clearResetMessage();

    }



    async function submitResetCode() {

        clearResetMessage();

        const code = document.getElementById('reset-code').value.trim();

        const pw = document.getElementById('reset-password').value;

        const pw2 = document.getElementById('reset-password2').value;

        const account = allUsers.find(u => (u.email || '').toLowerCase() === pendingResetEmail);

        if (!account) { setResetMessage('Something went wrong, please try logging in again.', 'bad'); return; }

        if (!account.reset_code || code !== account.reset_code) { setResetMessage('That code is incorrect.', 'bad'); return; }

        if (!account.reset_code_expires || Date.now() > account.reset_code_expires) { setResetMessage('That code has expired. Please resend a new one.', 'bad'); return; }

        if (pw.length < 6) { setResetMessage('New password must be at least 6 characters.', 'bad'); return; }

        if (pw !== pw2) { setResetMessage('Passwords do not match.', 'bad'); return; }

        const salt = randomHex(16);

        const hash = await sha256Hex(salt + pw);

        const updated = { ...account, password_salt: salt, password_hash: hash, reset_code: null, reset_code_expires: null };

        await window.dataSdk.update(updated);

        enterApp(updated);

    }



    async function resendCode() {

        const account = allUsers.find(u => (u.email || '').toLowerCase() === pendingResetEmail);

        if (!account) return;

        const btn = document.getElementById('resend-btn');

        btn.disabled = true;

        await sendResetCode(account);

        let secs = 30;

        btn.textContent = `Resend code (${secs}s)`;

        const iv = setInterval(() => {

            secs--;

            if (secs <= 0) { clearInterval(iv); btn.disabled = false; btn.textContent = 'Resend code'; }

            else btn.textContent = `Resend code (${secs}s)`;

        }, 1000);

    }



    function cancelReset() {

        pendingResetEmail = null;

        document.getElementById('reset-screen').classList.add('hidden');

        document.getElementById('auth-screen').classList.remove('hidden');

        switchAuthTab('login');

    }



    function enterApp(account) {

        currentUserEmail = account.email;

        userData = account;

        currentUser = account.display_name;

        pendingResetEmail = null;

        document.getElementById('auth-screen').classList.add('hidden');

        document.getElementById('reset-screen').classList.add('hidden');

        document.getElementById('category-screen').classList.remove('hidden');

        updateStats();

    }



    function logOut() {

        currentUserEmail = null; userData = null; currentUser = null;

        document.getElementById('category-screen').classList.add('hidden');

        document.getElementById('quiz-area').classList.add('hidden');

        document.getElementById('result-area').classList.add('hidden');

        document.getElementById('change-pw-screen').classList.add('hidden');

        document.getElementById('login-email').value = '';

        document.getElementById('login-password').value = '';

        document.getElementById('auth-screen').classList.remove('hidden');

        switchAuthTab('login');

    }



    function openChangePassword() {

        document.getElementById('change-pw-screen').classList.remove('hidden');

        document.getElementById('cp-current').value = '';

        document.getElementById('cp-new').value = '';

        document.getElementById('cp-new2').value = '';

        clearCpMessage();

    }

    function closeChangePassword() { document.getElementById('change-pw-screen').classList.add('hidden'); }



    async function submitChangePassword() {

        clearCpMessage();

        const current = document.getElementById('cp-current').value;

        const pw = document.getElementById('cp-new').value;

        const pw2 = document.getElementById('cp-new2').value;

        const hash = await sha256Hex(userData.password_salt + current);

        if (hash !== userData.password_hash) { setCpMessage('Current password is incorrect.', 'bad'); return; }

        if (pw.length < 6) { setCpMessage('New password must be at least 6 characters.', 'bad'); return; }

        if (pw !== pw2) { setCpMessage('New passwords do not match.', 'bad'); return; }

        const salt = randomHex(16);

        const newHash = await sha256Hex(salt + pw);

        const updated = { ...userData, password_salt: salt, password_hash: newHash };

        await window.dataSdk.update(updated);

        userData = updated;

        setCpMessage('Password updated successfully.', 'good');

    }



    function updateStats() {

        if (!userData) return;

        document.getElementById('stat-quizzes').textContent = userData.quizzes_taken || 0;

        document.getElementById('stat-score').textContent = Math.round(userData.total_score || 0);

        document.getElementById('stat-accuracy').textContent = (userData.avg_accuracy || 0) + '%';

    }



    function startQuiz(category) {

        currentCategory = category;

        diffLevel = userData ? (userData.difficulty_level || 1) : 1;

        const bank = questionBank[category];

        questions = shuffleAndSelect(bank, diffLevel);

        current = 0; score = 0; totalAnswered = 0; totalCorrect = 0; penaltyPoints = 0;

        correctStreak = 0; wrongStreak = 0;

        document.getElementById('category-screen').classList.add('hidden');

        document.getElementById('quiz-area').classList.remove('hidden');

        showQuestion();

    }



    function shuffleAndSelect(bank, level) {

        const suitable = bank.filter(q => Math.abs(q.diff - level) <= 1);

        const pool = suitable.length >= 5 ? suitable : bank;

        const shuffled = [...pool].sort(() => Math.random() - 0.5);

        return shuffled.slice(0, Math.min(8, shuffled.length));

    }



    function showQuestion() {

        answered = false;

        const qObj = questions[current];

        document.getElementById('progress').textContent = `${current+1}/${questions.length}`;

        document.getElementById('score-display').textContent = `Score: ${score.toFixed(1)}`;

        document.getElementById('question-text').textContent = qObj.q;

        document.getElementById('next-btn').classList.add('hidden');

        document.getElementById('feedback-text').classList.add('hidden');

        document.getElementById('difficulty-badge').textContent = `Level ${diffLevel}`;

        const optsDiv = document.getElementById('options');

        optsDiv.innerHTML = '';

        qObj.opts.forEach((o, i) => {

            const btn = document.createElement('button');

            btn.className = 'opt-btn w-full text-left px-5 py-3 rounded-xl border-2 border-gray-200 font-medium bg-white';

            btn.textContent = o;

            btn.onclick = () => selectAnswer(i, btn);

            optsDiv.appendChild(btn);

        });

        startTimer();

    }



    function startTimer() {

        timeLeft = 30;

        document.getElementById('timer-bar').style.width = '100%';

        document.getElementById('timer-text').textContent = '30s';

        clearInterval(timer);

        timer = setInterval(() => {

            timeLeft--;

            document.getElementById('timer-bar').style.width = (timeLeft/30*100) + '%';

            document.getElementById('timer-text').textContent = timeLeft + 's';

            if (timeLeft <= 5) document.getElementById('timer-bar').style.background = '#dc2626';

            else document.getElementById('timer-bar').style.background = '#6366f1';

            if (timeLeft <= 0) { clearInterval(timer); timeOut(); }

        }, 1000);

    }



    function timeOut() {

        if (answered) return;

        answered = true; totalAnswered++;

        wrongStreak++; correctStreak = 0;

        penaltyPoints += 0.25; score -= 0.25;

        const correct = questions[current].ans;

        document.getElementById('options').children[correct].classList.add('opt-correct');

        [...document.getElementById('options').children].forEach(b => b.disabled = true);

        const fb = document.getElementById('feedback-text');

        fb.textContent = '⏱ Time\'s up! -0.25 penalty'; fb.style.color = '#dc2626';

        fb.classList.remove('hidden');

        document.getElementById('score-display').textContent = `Score: ${score.toFixed(1)}`;

        document.getElementById('next-btn').classList.remove('hidden');

        adaptDifficulty();

    }



    function selectAnswer(i, btn) {

        if (answered) return;

        clearInterval(timer);

        answered = true; totalAnswered++;

        const correct = questions[current].ans;

        if (i === correct) {

            score++; totalCorrect++; correctStreak++; wrongStreak = 0;

            btn.classList.add('opt-correct');

            const fb = document.getElementById('feedback-text');

            fb.textContent = '✓ Correct! +1'; fb.style.color = '#059669';

            fb.classList.remove('hidden');

        } else {

            wrongStreak++; correctStreak = 0;

            penaltyPoints += 0.25; score -= 0.25;

            btn.classList.add('opt-wrong');

            document.getElementById('options').children[correct].classList.add('opt-correct');

            const fb = document.getElementById('feedback-text');

            fb.textContent = '✗ Wrong! -0.25 penalty'; fb.style.color = '#dc2626';

            fb.classList.remove('hidden');

        }

        [...document.getElementById('options').children].forEach(b => b.disabled = true);

        document.getElementById('score-display').textContent = `Score: ${score.toFixed(1)}`;

        document.getElementById('next-btn').classList.remove('hidden');

        adaptDifficulty();

    }



    function adaptDifficulty() {

        if (correctStreak >= 3 && diffLevel < 3) { diffLevel++; correctStreak = 0; }

        if (wrongStreak >= 2 && diffLevel > 1) { diffLevel--; wrongStreak = 0; }

    }



    function nextQuestion() {

        current++;

        if (current >= questions.length) showResult();

        else showQuestion();

    }



    async function showResult() {

        clearInterval(timer);

        document.getElementById('quiz-area').classList.add('hidden');

        document.getElementById('result-area').classList.remove('hidden');

        document.getElementById('result-score').textContent = `${score.toFixed(1)}/${questions.length}`;

        const pct = totalAnswered > 0 ? Math.round(totalCorrect/totalAnswered*100) : 0;

        document.getElementById('result-detail').textContent = pct >= 75 ? 'Excellent work!' : pct >= 50 ? 'Good effort!' : 'Keep practising!';

        document.getElementById('result-penalty').textContent = penaltyPoints > 0 ? `(${penaltyPoints.toFixed(2)} penalty points deducted)` : '';



        if (userData) {

            const newQuizzes = (userData.quizzes_taken || 0) + 1;

            const newTotal = (userData.total_score || 0) + score;

            const oldCorrect = (userData.avg_accuracy || 0) * (userData.quizzes_taken || 0) / 100;

            const newAvg = Math.round((oldCorrect * (totalAnswered > 0 ? 1 : 0) + totalCorrect) / ((userData.quizzes_taken || 0) * 8 + totalAnswered) * 100) || pct;

            const updated = { ...userData, total_score: Math.round(newTotal * 10) / 10, quizzes_taken: newQuizzes, avg_accuracy: newAvg, last_category: currentCategory, difficulty_level: diffLevel };

            userData = updated;

            await window.dataSdk.update(updated);

        }

    }



    function goToCategories() {

        document.getElementById('result-area').classList.add('hidden');

        document.getElementById('category-screen').classList.remove('hidden');

    }



    document.addEventListener('DOMContentLoaded', initApp);

    </script>
