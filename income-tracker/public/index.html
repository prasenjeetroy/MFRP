<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Income Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root">
    <noscript>Income Tracker needs JavaScript turned on.</noscript>
  </div>

  <!-- Exact versions are pinned so an upstream release can never break the page. -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- Babel downloads and compiles this file, so the page must be served over
       http://localhost (npm run dev), never opened as a file:// path. -->
  <script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
