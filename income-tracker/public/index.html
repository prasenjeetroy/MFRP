<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Income Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root">
    <noscript>Income Tracker needs JavaScript turned on.</noscript>
  </div>

  <!-- Exact versions are pinned so an upstream release can never break the page. -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

  <!-- Not a file on disk: script.js generates it from its "Browser app" section.
       Open the page through http://localhost:3000 (npm run dev), not as a file. -->
  <script src="app.js"></script>
</body>
</html>
