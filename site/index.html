<title>MathLearn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
  /* Layout: a calm reading column — a short hero with today's puzzle beside it,
     then six topic cards; a set opens as one question card at a time.
     Tokens follow the MFRP design system (light), with a matching dark set. */
  :root {
    --paper: #f7f5ef;
    --surface: #ffffff;
    --ink: #1b1f24;
    --ink-muted: #5b6470;
    --rule: #d9d4c7;
    --border: #8a8578;
    --primary: #1f5f8b;
    --on-primary: #ffffff;
    --primary-tint: #e3edf4;
    --accent: #b5521a;

    --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 16px;
    --space-4: 32px;
    --radius-sm: 2px;
    --radius-md: 6px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #15171a;
      --surface: #1d2024;
      --ink: #ecebe6;
      --ink-muted: #a4abb4;
      --rule: #30343a;
      --border: #7b828c;
      --primary: #86b7dc;
      --on-primary: #10161b;
      --primary-tint: #1c3242;
      --accent: #e8955e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #15171a;
    --surface: #1d2024;
    --ink: #ecebe6;
    --ink-muted: #a4abb4;
    --rule: #30343a;
    --border: #7b828c;
    --primary: #86b7dc;
    --on-primary: #10161b;
    --primary-tint: #1c3242;
    --accent: #e8955e;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/24px var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: var(--space-4) 48px;
  }
  h1, h2, h3, p { margin: 0; }
  h1, h2 { text-wrap: balance; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .label {
    font: 500 12px/16px var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .caption { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
  .num { font-family: var(--mono); }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-3);
    flex-wrap: wrap;
    padding-bottom: var(--space-3);
    border-bottom: 1px solid var(--rule);
  }
  .brand {
    font: 600 22px/28px var(--serif);
    letter-spacing: -0.01em;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    min-height: 40px;
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: transparent;
    font-size: 15px;
    line-height: 20px;
    cursor: pointer;
  }
  .btn:hover { background: var(--primary-tint); }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary);
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--primary); filter: brightness(1.08); }
  .btn-quiet { border-color: transparent; color: var(--ink-muted); padding-inline: var(--space-2); }
  .btn-quiet:hover { color: var(--ink); background: transparent; text-decoration: underline; }

  /* ---------- hero ---------- */
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: var(--space-4);
    align-items: center;
    padding-block: 48px var(--space-4);
  }
  .hero h1 {
    font: 600 48px/52px var(--serif);
    letter-spacing: -0.01em;
  }
  .hero .lede { margin-top: var(--space-3); max-width: 36ch; color: var(--ink); }
  .hero .facts {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2) var(--space-3);
    margin-top: var(--space-3);
  }

  /* ---------- question card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: var(--space-3);
    min-width: 0;
  }
  .qcard { padding: 24px; display: grid; gap: var(--space-3); }
  .qcard .q-text { font-size: 20px; line-height: 28px; font-weight: 600; }
  .options { display: grid; gap: var(--space-2); }
  .opt {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-3);
    width: 100%;
    min-height: 48px;
    padding: 10px 14px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font: 400 16px/22px var(--mono);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-tint); }
  .opt:disabled { cursor: default; }
  .opt .tag { font: 500 12px/16px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .opt.tried { color: var(--ink-muted); border-color: var(--rule); }
  .opt.tried .val { text-decoration: line-through; }
  .opt.correct { background: var(--primary-tint); border-color: var(--primary); }
  .opt.correct .tag { color: var(--primary); }
  .opt.dim { color: var(--ink-muted); border-color: var(--rule); }

  .feedback { min-height: 24px; color: var(--ink-muted); }
  .why {
    background: var(--primary-tint);
    border: 1px solid var(--rule);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    display: grid;
    gap: var(--space-1);
  }
  .why .answer { font-family: var(--mono); color: var(--accent); font-weight: 500; }
  .q-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; justify-content: space-between; }

  .shake { animation: shake 0.3s ease; }
  @keyframes shake {
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } .opt { transition: none; } }

  /* ---------- topics ---------- */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .section-head h2 { font: 600 28px/34px var(--serif); }
  .topics {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: var(--space-3);
  }
  .topic { display: grid; gap: var(--space-2); align-content: start; }
  .topic-head { display: flex; align-items: center; gap: 12px; }
  .glyph {
    flex: none;
    min-width: 64px;
    padding: 6px 8px;
    text-align: center;
    font: 500 14px/20px var(--mono);
    background: var(--primary-tint);
    border: 1px solid var(--rule);
    border-radius: var(--radius-md);
    white-space: nowrap;
  }
  .topic-name { font: 600 18px/26px var(--sans); }
  .sets { list-style: none; margin: 0; padding: 0; }
  .sets li + li { border-top: 1px solid var(--rule); }
  .set-row {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    width: 100%;
    padding: 10px 4px;
    background: none;
    border: 0;
    border-radius: var(--radius-sm);
    text-align: left;
    cursor: pointer;
  }
  .set-row:hover { background: var(--primary-tint); }
  .set-row .n { font: 400 13px/18px var(--mono); color: var(--ink-muted); }
  .set-row .t { font-size: 15px; line-height: 20px; }

  .dots { display: inline-flex; gap: 4px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border); }
  .dot.on { background: var(--primary); border-color: var(--primary); }
  .dot.here { outline: 2px solid var(--primary); outline-offset: 1px; }

  /* ---------- practice ---------- */
  .practice { max-width: 680px; margin: 0 auto; padding-block: var(--space-4) 0; display: grid; gap: var(--space-3); }
  .practice-head { display: grid; gap: var(--space-1); }
  .practice-head h1 { font: 600 28px/34px var(--serif); }
  .practice-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .done-card { padding: 24px; display: grid; gap: var(--space-3); }
  .done-card h2 { font: 600 28px/34px var(--serif); }

  /* ---------- footer ---------- */
  footer {
    margin-top: 48px;
    padding-top: var(--space-3);
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-2) var(--space-3);
    flex-wrap: wrap;
  }
  .confirm { display: inline-flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }

  @media (max-width: 800px) {
    .hero { grid-template-columns: 1fr; padding-block: var(--space-4) var(--space-3); }
    .hero h1 { font-size: 40px; line-height: 44px; }
  }
  @media (max-width: 420px) {
    .qcard, .done-card { padding: var(--space-3); }
    .qcard .q-text { font-size: 18px; line-height: 26px; }
  }
</style>

<div class="wrap">
  <header class="masthead">
    <button class="brand" id="brand" type="button">MathLearn</button>
    <span class="caption">Practice at your own pace</span>
  </header>

  <main id="view"></main>

  <footer>
    <span class="caption" id="saveNote">Progress saves in this browser.</span>
    <span id="resetArea"></span>
  </footer>
</div>

const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const ALL = [];
TOPICS.forEach(t => t.sets.forEach((s, si) => s.qs.forEach((q, qi) => ALL.push({ topic: t.id, set: si, index: qi }))));
const setKey = (topic, set) => `${topic}-${set + 1}`;

/* =========================================================
   PROGRESS — which questions are solved.
   Saved to the viewer's Claude account when the page can
   (follows them to every device), otherwise in this browser.
   ========================================================= */
const LOCAL_KEY = "mathlearn_site_progress";
let solved = {};               // { "algebra-2": [0, 3, 5] }
let remoteRef = null;
let saveTimer = null;

function readLocal() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}").solved || {}; } catch (e) { return {}; }
}
function writeLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ solved })); } catch (e) { /* storage unavailable */ }
}

/* Union of two solved maps; keeps only well-formed entries */
function unionSolved(a, b) {
  const out = {};
  [a, b].forEach(src => {
    if (!src || typeof src !== "object") return;
    Object.entries(src).forEach(([k, list]) => {
      if (!/^[a-z]+-[1-5]$/.test(k) || !Array.isArray(list)) return;
      const set = new Set(out[k] || []);
      list.forEach(i => { if (Number.isInteger(i) && i >= 0 && i < 6) set.add(i); });
      out[k] = [...set].sort((x, y) => x - y);
    });
  });
  return out;
}
const sameSolved = (a, b) => JSON.stringify(unionSolved(a, {})) === JSON.stringify(unionSolved(b, {}));

function isSolved(topic, set, index) {
  return (solved[setKey(topic, set)] || []).includes(index);
}
function solvedInSet(topic, set) {
  return (solved[setKey(topic, set)] || []).length;
}
function solvedInTopic(topic) {
  return TOPIC[topic].sets.reduce((n, s, si) => n + solvedInSet(topic, si), 0);
}

function markSolved(item) {
  const k = setKey(item.topic, item.set);
  if ((solved[k] || []).includes(item.index)) return;
  solved = unionSolved(solved, { [k]: [item.index] });
  scheduleSave();
}

function scheduleSave() {
  writeLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!remoteRef) return;
    try { await remoteRef.set({ solved, updatedAt: new Date().toISOString() }); } catch (e) { /* stays in this browser */ }
  }, 500);
}

async function connectAccount() {
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    remoteRef = db.doc(`data/users/${uid}/progress`);
    const snap = await remoteRef.get();
    const remote = snap.exists ? snap.data().solved : {};
    const merged = unionSolved(remote, solved);
    if (!sameSolved(merged, solved)) { solved = merged; writeLocal(); refreshProgressMarks(); }
    if (!sameSolved(merged, remote)) scheduleSave();
    setSaveNote("Progress saves to your Claude account, so it follows you to any device.");

    // Progress made on another device shows up here live
    remoteRef.onSnapshot(s => {
      if (!s.exists) return;
      const next = unionSolved(solved, s.data().solved);
      if (!sameSolved(next, solved)) { solved = next; writeLocal(); refreshProgressMarks(); }
    }, () => {});
  } catch (e) {
    remoteRef = null; // keep working from this browser
  }
}

function setSaveNote(text) { document.getElementById("saveNote").textContent = text; }

/* =========================================================
   SMALL HELPERS
   ========================================================= */
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n[k] = v;
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(k => { if (k != null && k !== false) n.append(k instanceof Node ? k : String(k)); });
  return n;
}

function shuffle(arr, rand = Math.random) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Small seeded random so today's puzzle looks the same all day */
function seeded(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeItem(ref, rand) {
  const [q, correct, w1, w2, w3, why] = TOPIC[ref.topic].sets[ref.set].qs[ref.index];
  const options = shuffle([correct, w1, w2, w3], rand);
  return { ...ref, q, why, correct, options, answer: options.indexOf(correct) };
}

function dots(topic, set, order, here) {
  const wrap = el("span", { class: "dots", "aria-hidden": "true" });
  (order || [0, 1, 2, 3, 4, 5]).forEach((qi, pos) => {
    wrap.append(el("span", { class: "dot" + (isSolved(topic, set, qi) ? " on" : "") + (pos === here ? " here" : "") }));
  });
  return wrap;
}

/* =========================================================
   QUESTION CARD — try as often as you like, then see why.
   ========================================================= */
function questionCard(item, { label, nextText, onNext, headingTag = "h2" }) {
  let done = false;
  const feedback = el("p", { class: "feedback", "aria-live": "polite" });
  const why = el("div", { class: "why", hidden: true },
    el("span", { class: "label" }, "Why"),
    el("p", {}, "Answer: ", el("span", { class: "answer" }, item.correct)),
    el("p", {}, item.why));

  const nextBtn = nextText ? el("button", { class: "btn btn-primary", type: "button", hidden: true, onclick: onNext }, nextText) : null;
  const showBtn = el("button", { class: "btn btn-quiet", type: "button", onclick: () => finish(null) }, "Show the answer");

  const buttons = item.options.map((opt, i) =>
    el("button", { class: "opt", type: "button", onclick: () => choose(i) },
      el("span", { class: "val" }, opt), el("span", { class: "tag" })));

  function finish(chosen) {
    if (done) return;
    done = true;
    buttons.forEach((b, i) => {
      b.disabled = true;
      if (i === item.answer) {
        b.classList.add("correct");
        b.querySelector(".tag").textContent = chosen === i ? "Correct" : "Answer";
      } else if (!b.classList.contains("tried")) {
        b.classList.add("dim");
      }
    });
    feedback.textContent = chosen === item.answer ? "That's it." : "Here's the answer.";
    why.hidden = false;
    showBtn.hidden = true;
    markSolved(item);
    refreshProgressMarks();
    if (nextBtn) { nextBtn.hidden = false; nextBtn.focus({ preventScroll: true }); }
  }

  function choose(i) {
    if (done) return;
    if (i === item.answer) return finish(i);
    const b = buttons[i];
    b.classList.add("tried");
    b.disabled = true;
    b.querySelector(".tag").textContent = "Not this one";
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    feedback.textContent = "Not this one. Have another look.";
  }

  return el("div", { class: "card qcard" },
    label ? el("span", { class: "label" }, label) : null,
    el(headingTag, { class: "q-text" }, item.q),
    el("div", { class: "options" }, buttons),
    feedback,
    why,
    el("div", { class: "q-actions" }, showBtn, nextBtn));
}

/* =========================================================
   VIEWS
   ========================================================= */
const view = document.getElementById("view");
let practice = null;           // { topic, set, order, pos }

function parseRoute() {
  const m = /^#([a-z]+)-([1-5])$/.exec(location.hash);
  if (m && TOPIC[m[1]]) return { topic: m[1], set: Number(m[2]) - 1 };
  return null;
}

function render() {
  const route = parseRoute();
  if (route) renderPractice(route);
  else renderHome();
}

/* Update progress dots without rebuilding the question in front of the viewer */
function refreshProgressMarks() {
  document.querySelectorAll("[data-dots]").forEach(node => {
    const [topic, set] = node.dataset.dots.split("|");
    const here = node.dataset.here === undefined ? -1 : Number(node.dataset.here);
    const order = node.dataset.order ? node.dataset.order.split(",").map(Number) : null;
    node.replaceChildren(dots(topic, Number(set), order, here));
  });
  document.querySelectorAll("[data-count]").forEach(node => {
    node.textContent = `${solvedInTopic(node.dataset.count)} of 30 solved`;
  });
}

function todaysItem() {
  const now = new Date();
  const day = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  const ref = ALL[(day * 37) % ALL.length];
  return makeItem(ref, seeded(day));
}

function renderHome() {
  practice = null;
  document.title = "MathLearn";
  const today = todaysItem();
  const t = TOPIC[today.topic];

  const hero = el("section", { class: "hero" },
    el("div", {},
      el("h1", {}, "Enjoy math."),
      el("p", { class: "lede" },
        "Pick a topic and work through it at your own pace. There is no timer and no score. Try as many times as you like, and every answer shows you why it works."),
      el("div", { class: "facts" },
        el("span", { class: "label" }, "6 topics"),
        el("span", { class: "label" }, "30 short sets"),
        el("span", { class: "label" }, "180 questions"))),
    questionCard(today, {
      label: `Today's puzzle · ${t.name}`,
      nextText: `More ${t.name.toLowerCase()}`,
      onNext: () => { location.hash = setKey(today.topic, today.set); }
    }));

  const grid = el("div", { class: "topics" });
  TOPICS.forEach(topic => {
    const list = el("ul", { class: "sets" });
    topic.sets.forEach((s, si) => {
      list.append(el("li", {},
        el("button", { class: "set-row", type: "button",
            "aria-label": `${s.title}, ${solvedInSet(topic.id, si)} of 6 solved`,
            onclick: () => { location.hash = setKey(topic.id, si); } },
          el("span", { class: "n" }, si + 1),
          el("span", { class: "t" }, s.title),
          el("span", { "data-dots": `${topic.id}|${si}` }, dots(topic.id, si)))));
    });
    grid.append(el("article", { class: "card topic" },
      el("div", { class: "topic-head" },
        el("span", { class: "glyph", "aria-hidden": "true" }, topic.glyph),
        el("div", {},
          el("h3", { class: "topic-name" }, topic.name),
          el("p", { class: "caption", "data-count": topic.id }, `${solvedInTopic(topic.id)} of 30 solved`))),
      list));
  });

  view.replaceChildren(
    hero,
    el("section", {},
      el("div", { class: "section-head" },
        el("h2", {}, "Topics"),
        el("p", { class: "caption" }, "Every set is open. Start anywhere.")),
      grid));
}

function renderPractice(route, restore) {
  const topic = TOPIC[route.topic];
  const set = topic.sets[route.set];
  const same = practice && practice.topic === route.topic && practice.set === route.set;
  if (restore && restore.topic === route.topic && restore.set === route.set) practice = restore;
  else if (!same) {
    // Unsolved questions first, each set in a fresh order
    const order = shuffle([0, 1, 2, 3, 4, 5]);
    order.sort((a, b) => isSolved(route.topic, route.set, a) - isSolved(route.topic, route.set, b));
    practice = { topic: route.topic, set: route.set, order, pos: 0 };
  }
  document.title = `${set.title} · MathLearn`;

  const back = el("div", {}, el("button", { class: "btn btn-quiet", type: "button", onclick: () => { location.hash = ""; } }, "← All topics"));
  const head = el("div", { class: "practice-head" },
    el("span", { class: "label" }, `${topic.name} · Set ${route.set + 1} of 5`),
    el("h1", {}, set.title));

  if (practice.pos >= 6) {
    const nextSet = route.set + 1 < 5 ? route.set + 1 : null;
    view.replaceChildren(el("section", { class: "practice" }, back, head,
      el("div", { class: "card done-card" },
        el("h2", {}, "Set finished"),
        el("p", {}, `You worked through all six ${set.title.toLowerCase()} questions. Come back to them whenever you like.`),
        el("div", { "data-dots": `${route.topic}|${route.set}` }, dots(route.topic, route.set)),
        el("div", { class: "q-actions" },
          nextSet !== null
            ? el("button", { class: "btn btn-primary", type: "button", onclick: () => { location.hash = setKey(route.topic, nextSet); } },
                `Next: ${topic.sets[nextSet].title}`)
            : el("button", { class: "btn btn-primary", type: "button", onclick: () => { location.hash = ""; } }, "Choose another topic"),
          el("button", { class: "btn", type: "button", onclick: () => { practice = null; renderPractice(route); } }, "Go through this set again")))));
    view.querySelector(".done-card .btn-primary").focus({ preventScroll: true });
    return;
  }

  const qi = practice.order[practice.pos];
  const item = makeItem({ topic: route.topic, set: route.set, index: qi });
  const meta = el("div", { class: "practice-meta" },
    el("span", { "data-dots": `${route.topic}|${route.set}`, "data-order": practice.order.join(","), "data-here": practice.pos },
      dots(route.topic, route.set, practice.order, practice.pos)),
    el("span", { class: "caption num" }, `Question ${practice.pos + 1} of 6`));

  view.replaceChildren(el("section", { class: "practice" }, back, head, meta,
    questionCard(item, {
      nextText: practice.pos < 5 ? "Next question" : "Finish set",
      onNext: () => { practice.pos++; renderPractice(route); window.scrollTo({ top: 0 }); }
    })));
}

/* =========================================================
   START OVER (inline confirm — no dialogs)
   ========================================================= */
function renderReset(confirming = false) {
  const area = document.getElementById("resetArea");
  if (!confirming) {
    area.replaceChildren(el("button", { class: "btn btn-quiet", type: "button", onclick: () => renderReset(true) }, "Start over"));
    return;
  }
  area.replaceChildren(el("span", { class: "confirm" },
    el("span", { class: "caption" }, "Clear every solved question?"),
    el("button", { class: "btn", type: "button", onclick: async () => {
      solved = {};
      writeLocal();
      if (remoteRef) { try { await remoteRef.set({ solved: {}, updatedAt: new Date().toISOString() }); } catch (e) {} }
      renderReset(false);
      render();
    } }, "Clear"),
    el("button", { class: "btn btn-quiet", type: "button", onclick: () => renderReset(false) }, "Keep")));
}

/* =========================================================
   BOOT
   ========================================================= */
function start(data) {
  solved = unionSolved(readLocal(), {});
  const route = parseRoute();
  if (route && data && data.practice) renderPractice(route, data.practice);
  else render();
  renderReset(false);
  connectAccount();
}

document.getElementById("brand").onclick = () => { location.hash = ""; };
window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0 }); });
window.claude?.hot?.snapshot?.(() => ({ practice }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
